<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Globe - Educational Platform</title>
  <link rel="stylesheet" href="./public/styles/main.css">
</head>
<body>
  <div id="app">
    <div id="globe-container"></div>
    <div id="ui-overlay">
      <div class="top-bar">
        <button class="context-btn active" data-context="geography">🌍 География</button>
        <button class="context-btn" data-context="history">📜 История</button>
        <button class="context-btn" data-context="biology">🧬 Биология</button>
        <button class="context-btn" data-context="technical">⚙️ Техника</button>
      </div>
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span>Система активна</span>
      </div>
    </div>
    <div id="info-panel">
      <div class="title">Добро пожаловать</div>
      <div class="subtitle">Вращайте глобус и исследуйте мир</div>
    </div>
  </div>
  <div id="loading">
    <div class="loader"></div>
    <div class="loading-text">ЗАГРУЗКА ГЛОБУСА</div>
  </div>
  <div id="error-message"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
