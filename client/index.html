<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Globe - Educational Platform</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000011;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    #globe-container {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* UI Overlay */
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      background: linear-gradient(180deg, rgba(0,0,20,0.8) 0%, transparent 100%);
      pointer-events: auto;
    }
    .context-btn {
      padding: 10px 24px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      pointer-events: auto;
    }
    .context-btn:hover {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.9);
      border-color: rgba(255,255,255,0.4);
      transform: translateY(-2px);
    }
    .context-btn.active {
      background: rgba(64, 128, 255, 0.25);
      color: #fff;
      border-color: rgba(64, 128, 255, 0.6);
      box-shadow: 0 0 20px rgba(64, 128, 255, 0.15);
    }
    /* Info Panel */
    #info-panel {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 28px;
      background: rgba(0,0,20,0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      text-align: center;
      pointer-events: none;
      transition: all 0.5s ease;
      opacity: 0;
      min-width: 200px;
      max-width: 80%;
    }
    #info-panel.visible {
      opacity: 1;
    }
    #info-panel .title {
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }
    #info-panel .subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
    }
    /* Status Indicator */
    .status-indicator {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      pointer-events: none;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    /* Loading */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000011;
      z-index: 100;
      transition: opacity 0.8s ease;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255,255,255,0.05);
      border-top-color: #4080ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      color: rgba(255,255,255,0.3);
      font-size: 14px;
      margin-top: 20px;
      letter-spacing: 2px;
    }
    #error-message {
      position: fixed;
      bottom: 50%;
      left: 50%;
      transform: translate(-50%, 50%);
      color: #ff4444;
      font-size: 16px;
      text-align: center;
      display: none;
      z-index: 100;
      background: rgba(0,0,0,0.9);
      padding: 30px 40px;
      border-radius: 16px;
      border: 1px solid rgba(255,68,68,0.2);
    }

    /* Filter Bar */
    .filter-bar {
        display: flex;
        justify-content: center;
        gap: 8px;
        padding: 12px 20px;
        background: linear-gradient(180deg, rgba(0,0,20,0.6) 0%, transparent 100%);
        pointer-events: auto;
        flex-wrap: wrap;
    }

    .lens-group {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .lens-btn {
        padding: 6px 14px;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 20px;
        background: rgba(255,255,255,0.03);
        color: rgba(255,255,255,0.5);
        font-size: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        backdrop-filter: blur(5px);
        pointer-events: auto;
    }

    .lens-btn:hover {
        background: rgba(255,255,255,0.08);
        color: rgba(255,255,255,0.8);
        border-color: rgba(255,255,255,0.2);
    }

    .lens-btn.active {
        background: rgba(64, 128, 255, 0.2);
        color: #fff;
        border-color: rgba(64, 128, 255, 0.4);
        box-shadow: 0 0 15px rgba(64, 128, 255, 0.1);
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="globe-container"></div>
    <div id="ui-overlay">
      <div class="top-bar">
        <button class="context-btn active" data-context="geography">🌍 География</button>
        <button class="context-btn" data-context="history">📜 История</button>
        <button class="context-btn" data-context="biology">🧬 Биология</button>
        <button class="context-btn" data-context="technical">⚙️ Техника</button>
      </div>
      <div class="filter-bar">
        <div class="lens-group">
            <button class="lens-btn active" data-lens="population">👥 По населению</button>
            <button class="lens-btn" data-lens="area">📐 По площади</button>
            <button class="lens-btn" data-lens="density">📊 По плотности</button>
            <button class="lens-btn" data-lens="capitals">👑 Столицы</button>
            <button class="lens-btn" data-lens="megacities">🏙️ Мегаполисы</button>
            <button class="lens-btn" data-lens="major">🌆 Крупные</button>
        </div>
      </div>
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span>Система активна</span>
      </div>
    </div>
    <div id="info-panel">
      <div class="title">Добро пожаловать</div>
      <div class="subtitle">Вращайте глобус и исследуйте мир</div>
    </div>
  </div>
  <div id="loading">
    <div class="loader"></div>
    <div class="loading-text">ЗАГРУЗКА ГЛОБУСА</div>
  </div>
  <div id="error-message"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
